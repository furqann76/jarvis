[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "Local-first desktop computer-use assistant for Ubuntu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6~=6.7",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "dbus-fast>=2.21",       # AT-SPI accessibility + xdg-desktop-portal (mouse/keyboard)
    "playwright>=1.49",      # automated browser
    "numpy>=1.26",
    "faster-whisper>=1.0",   # speech-to-text
    "piper-tts>=1.3",        # text-to-speech
    "openwakeword>=0.4",     # always-on "Hey Jarvis" detection (CPU)
    "kokoro-onnx>=0.4",      # Jarvis-style British TTS voices
    "python-xlib>=0.33",     # raise the window from the background (XWayland)
]

[project.optional-dependencies]
# CUDA runtime libraries for GPU speech recognition (loaded by jarvis.voice.stt).
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-daemon = "jarvis.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Ollama daemon with the configured model",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
